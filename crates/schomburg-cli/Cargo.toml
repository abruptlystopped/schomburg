[package]
name = "schomburg-cli"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
schomburg-core = { path = "../schomburg-core" }
schomburg-connector = { path = "../schomburg-connector" }
schomburg-connector-git = { path = "../schomburg-connector-git" }
schomburg-engine = { path = "../schomburg-engine" }
schomburg-store = { path = "../schomburg-store" }
schomburg-agent = { path = "../schomburg-agent" }
schomburg-presenter = { path = "../schomburg-presenter" }
schomburg-service = { path = "../schomburg-service" }
time = { version = "0.3.53", default-features = false, features = ["formatting", "local-offset", "macros"] }
ctrlc = "3.4"

[dev-dependencies]
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
